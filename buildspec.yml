version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform..."
      - rm -f /tmp/terraform.zip
      - rm -rf /tmp/terraform
      - curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.16.1/terraform_1.16.1_linux_amd64.zip
      - unzip -t /tmp/terraform.zip
      - unzip -o /tmp/terraform.zip -d /tmp/terraform
      - install -m 0755 /tmp/terraform/terraform /usr/local/bin/terraform
      - terraform version
      - echo "Installing Checkov..."
      - pip3 install --no-cache-dir checkov==3.3.19

  pre_build:
    commands:
      - echo "Checking Terraform formatting..."
      - terraform fmt -check -recursive terraform

      - echo "Initializing application Terraform..."
      - terraform -chdir=terraform/app init -backend=false -input=false

      - echo "Validating application Terraform..."
      - terraform -chdir=terraform/app validate

      - echo "Initializing pipeline Terraform..."
      - terraform -chdir=terraform/pipeline init -input=false

      - echo "Validating pipeline Terraform..."
      - terraform -chdir=terraform/pipeline validate

      - echo "Running Checkov..."
      - checkov -d terraform

  build:
    commands:
      - echo "Terraform CI validation completed successfully."
